{% load static %}

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
            LITRevu
        {% endblock %}
    </title>

    <link rel="stylesheet" href="{% static 'reviews/style.css' %}">
</head>

<body>
    <header>
        {% if user.is_authenticated %}
            <a href="{% url 'feed' %}">LITRevu</a>

            <nav>
                <a href="{% url 'feed' %}">Flux</a>
                <a href="{% url 'posts' %}">Posts</a>
                <a href="{% url 'follow_users' %}">Abonnements</a>
                <a href="{% url 'logout' %}">Se déconnecter</a>
            </nav>
        {% else %}
            <span>LITRevu</span>
        {% endif %}
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
