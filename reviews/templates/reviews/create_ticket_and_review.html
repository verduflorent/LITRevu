<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Créer une critique - LITRevu</title>
</head>
<body>
    <h1>Créer une critique</h1>

    <h2>Livre / Article</h2>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        {{ ticket_form.as_p }}

        <h2>Critique</h2>

        {{ review_form.as_p }}

        <button type="submit">Envoyer</button>
    </form>

    <a href="{% url 'feed' %}">Retour au flux</a>
</body>
</html>
