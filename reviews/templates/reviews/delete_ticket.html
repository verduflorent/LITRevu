<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Supprimer un ticket - LITRevu</title>
</head>
<body>
    <h1>Supprimer le ticket</h1>

    <p>
        Voulez-vous vraiment supprimer
        « {{ ticket.title }} » ?
    </p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Supprimer</button>
    </form>

    <a href="{% url 'feed' %}">Annuler</a>
</body>
</html>
