<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Créer un ticket - LITRevu</title>
</head>
<body>
    <h1>Créer un ticket</h1>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Envoyer</button>
    </form>

    <a href="{% url 'feed' %}">Retour au flux</a>
</body>
</html>
